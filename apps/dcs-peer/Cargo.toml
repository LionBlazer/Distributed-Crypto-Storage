[package]
name = "dcs-peer"
version = "0.1.0"
edition.workspace = true
rust-version = "1.99"
publish = false

[dependencies]
bfv-query-proof = { path = "../../crates/bfv-query-proof" }
peer-runtime = { path = "../../crates/peer-runtime" }
peer-transport = { path = "../../crates/peer-transport" }
serde_json.workspace = true
zeroize = "1"

[dev-dependencies]
chacha20poly1305 = "=0.10.1"
bfv-hiding-stark = { path = "../../crates/bfv-hiding-stark" }
bfv-product-evidence = { path = "../../crates/bfv-product-evidence" }
registry200-finality = { path = "../../crates/registry200-finality" }
registry200-journal = { path = "../../crates/registry200-journal" }
registry200-joint = { path = "../../crates/registry200-joint" }
work-finality = { path = "../../crates/work-finality" }
protocol-storage = { path = "../../crates/protocol-storage" }
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["std", "fast", "zeroize"] }
bfv-mul-relin-proof = { path = "../../crates/bfv-mul-relin-proof" }
bfv-key-transform = { path = "../../crates/bfv-key-transform" }
registry200-proof = { path = "../../crates/registry200-proof" }
p3-field = "=0.8.0"
sha2 = "=0.10.9"
getrandom = "=0.2.17"
bincode = "=1.3.3"
bfv-query-core = { path = "../../crates/bfv-query-core", features = ["gold-owner"] }
bfv-ciphertext-formation = { path = "../../crates/bfv-ciphertext-formation" }
compact-query = { path = "../../crates/compact-query", default-features = false, features = ["bfv-experiment"] }
compact-store = { path = "../../crates/compact-store" }
relational-types = { path = "../../crates/relational-types" }
storage-client = { path = "../../crates/storage-client", features = ["private-input-proofs", "word-control", "word-query"] }
version-journal = { path = "../../crates/version-journal" }
rcgen = "=0.14.8"
