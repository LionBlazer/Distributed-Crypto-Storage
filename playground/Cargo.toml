[package]
name = "fhe-playground"
version = "0.1.0"
edition.workspace = true
rust-version = "1.99"
publish = false

[dependencies]
relational-types = { path = "../crates/relational-types" }
bfv-query-proof = { path = "../crates/bfv-query-proof" }
proof-acceleration = { path = "../crates/proof-acceleration" }
peer-runtime = { path = "../crates/peer-runtime" }
peer-transport = { path = "../crates/peer-transport" }
storage-client = { path = "../crates/storage-client" }
version-journal = { path = "../crates/version-journal" }
rcgen = "=0.14.8"
serde_json.workspace = true
zeroize = "1"
sql-plan = { path = "../crates/sql-plan" }
compact-query = { path = "../crates/compact-query", default-features = false, features = ["bfv-experiment"] }
compact-store = { path = "../crates/compact-store" }
peer-protocol = { path = "../crates/peer-protocol" }
replica-store = { path = "../crates/replica-store" }
eframe = { version = "=0.36.2", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
rayon.workspace = true
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "rustls-tls"] }
