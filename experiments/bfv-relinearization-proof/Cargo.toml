[package]
name = "bfv-relinearization-proof"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

# Stage research consumer, never a production operation or SQL acceptance path.
[workspace]

[dependencies]
bfv-relinearization-circuit = { path = "../../crates/bfv-relinearization-circuit", features = ["plonky3"] }
bfv-arithmetic-stark = { path = "../../crates/bfv-arithmetic-stark" }
bounded-postcard = { path = "../../crates/bounded-postcard" }
p3-air = "=0.8.0"
p3-field = "=0.8.0"
p3-matrix = "=0.8.0"
p3-uni-stark = "=0.8.0"
postcard = { version = "=1.1.3", features = ["alloc"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"

[dev-dependencies]
fhe = { version = "=0.1.1", default-features = false }
fhe-math = { version = "=0.1.1", default-features = false }
fhe-traits = "=0.1.1"
rand = "=0.9.2"

[profile.release]
debug = 0

[profile.test]
opt-level = 3
debug = 0
