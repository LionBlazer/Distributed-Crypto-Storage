[package]
name = "bfv-complete-relinearization"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

# Standalone composition experiment; no production admission or root workspace edge.
[workspace]

[dependencies]
bfv-ntt-witness-proof = { path = "../../crates/bfv-ntt-witness-proof" }
bfv-relinearization-multilinear-proof = { path = "../../crates/bfv-relinearization-multilinear-proof" }
bfv-ntt-circuit = { path = "../../crates/bfv-ntt-circuit" }
bfv-relinearization-circuit = { path = "../../crates/bfv-relinearization-circuit" }
bfv-relinearization-key-source = { path = "../../crates/bfv-relinearization-key-source" }
bfv-query-core = { path = "../../crates/bfv-query-core" }
bfv-fixed-geometry = { path = "../../crates/bfv-fixed-geometry" }
fhe = { version = "=0.1.1", default-features = false }
fhe-math = { version = "=0.1.1", default-features = false }
fhe-traits = "=0.1.1"
bincode = "=1.3.3"
sha2 = "=0.10.9"
serde_json = "=1.0.154"

[profile.release]
debug = 0

[profile.test]
opt-level = 3
debug = 0
