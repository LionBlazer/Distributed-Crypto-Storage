[package]
name = "bfv-ntt-witness-proof-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

# Standalone public-fixture CLI; proof implementation belongs to the core library.
[workspace]

[[bin]]
name = "bfv-ntt-witness-proof"
path = "src/main.rs"

[dependencies]
bfv-ntt-circuit = { path = "../../crates/bfv-ntt-circuit" }
bfv-ntt-witness-proof = { path = "../../crates/bfv-ntt-witness-proof" }
serde_json = "=1.0.154"
sha2 = "=0.10.9"

[profile.release]
debug = 0

[profile.test]
opt-level = 3
debug = 0
