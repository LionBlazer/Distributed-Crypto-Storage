[package]
name = "spiral-owner-state"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
spiral-rs = { path = "../../.local/private-access/sdk/lib/spiral-rs", features = ["server"] }
# These pins constrain the SDK's deterministic secret shuffle as well.
rand = "=0.8.5"
rand_chacha = "=0.3.1"
getrandom = "=0.2.17"
sha2 = "=0.10.9"
zeroize = "=1.9.1"
serde_json = "1"
