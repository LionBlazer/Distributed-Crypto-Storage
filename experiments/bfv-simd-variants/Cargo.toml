[package]
name = "compact-bfv-simd-variants"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

# A separate experiment: no dependency or feature is added to the main workspace.
[workspace]

[features]
default = []
optimized-ntt = ["fhe/tfhe-ntt"]

[dependencies]
compact-store = { path = "../../crates/compact-store" }
fhe = "=0.1.1"
fhe-traits = "=0.1.1"
rand = "=0.9.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "=1.3.3"
zeroize = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_System_ProcessStatus", "Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
