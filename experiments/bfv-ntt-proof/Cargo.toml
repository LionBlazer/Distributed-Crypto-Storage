[package]
name = "bfv-ntt-proof"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

# A separate arithmetic research consumer, never a production acceptance path.
[workspace]

[dependencies]
bfv-ntt-circuit = { path = "../../crates/bfv-ntt-circuit", features = ["plonky3"] }
bounded-postcard = { path = "../../crates/bounded-postcard" }
p3-air = "=0.8.0"
p3-challenger = "=0.8.0"
p3-commit = "=0.8.0"
p3-dft = "=0.8.0"
p3-field = "=0.8.0"
p3-fri = "=0.8.0"
p3-goldilocks = "=0.8.0"
p3-matrix = "=0.8.0"
p3-maybe-rayon = { version = "=0.8.0", features = ["parallel"] }
p3-merkle-tree = "=0.8.0"
p3-symmetric = "=0.8.0"
p3-uni-stark = "=0.8.0"
postcard = { version = "=1.1.3", features = ["alloc"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"

[dev-dependencies]
fhe-math = { version = "=0.1.1", default-features = false }

[profile.release]
debug = 0

[profile.test]
opt-level = 3
debug = 0
