[package]
name = "bfv-mul-relin-proof"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
[workspace]
[patch.crates-io]
p3-multi-stark = { path = "../p3-multi-stark-streaming" }
[dependencies]
bfv-mul-relin-circuit = { path = "../../crates/bfv-mul-relin-circuit" }
bfv-relinearization-key-source = { path = "../../crates/bfv-relinearization-key-source" }
bfv-arithmetic-batch-proof = { path = "../bfv-arithmetic-batch-proof" }
bfv-ntt-witness-proof = { path = "../bfv-ntt-witness-proof" }
bfv-relinearization-multilinear-proof = { path = "../bfv-relinearization-multilinear-proof" }
bfv-ntt-circuit = { path = "../../crates/bfv-ntt-circuit" }
bfv-scale-circuit = { path = "../../crates/bfv-scale-circuit" }
bfv-tensor-circuit = { path = "../../crates/bfv-tensor-circuit" }
bfv-relinearization-circuit = { path = "../../crates/bfv-relinearization-circuit" }
bfv-fixed-geometry = { path = "../../crates/bfv-fixed-geometry" }
bfv-ciphertext-wire = { path = "../../crates/bfv-ciphertext-wire" }
bfv-query-core = { path = "../../crates/bfv-query-core", features = ["formation-proofs"] }
bfv-ciphertext-formation = { path = "../../crates/bfv-ciphertext-formation" }
registry200-proof = { path = "../../crates/registry200-proof" }
bfv-key-transform = { path = "../../crates/bfv-key-transform" }
bfv-basis-convolution = { path = "../../crates/bfv-basis-convolution" }
fhe = { version = "=0.1.1", default-features = false }
fhe-traits = "=0.1.1"
p3-field = "=0.8.0"
sha2 = "=0.10.9"
[profile.release]
debug = 0
[profile.test]
opt-level = 3
debug = 0
