[package]
name = "hiding-fri-source-primitives"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

# This experiment is deliberately outside the production workspace.
[workspace]

[dependencies]
chacha20 = { version = "=0.9.1", features = ["zeroize"] }
p3-air = "=0.8.0"
p3-challenger = "=0.8.0"
p3-commit = "=0.8.0"
p3-dft = "=0.8.0"
p3-field = "=0.8.0"
p3-fri = "=0.8.0"
p3-goldilocks = "=0.8.0"
p3-matrix = "=0.8.0"
p3-maybe-rayon = { version = "=0.8.0", features = ["parallel"] }
p3-merkle-tree = "=0.8.0"
p3-sha256-air = "=0.8.0"
p3-symmetric = "=0.8.0"
p3-uni-stark = "=0.8.0"
rand = { version = "=0.10.3", default-features = false, features = ["std", "std_rng", "sys_rng"] }
sha2 = { version = "=0.10.9", features = ["compress"] }

[profile.release]
debug = 0

[profile.test]
opt-level = 3
debug = 0
