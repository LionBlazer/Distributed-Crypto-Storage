[package]
name = "bfv-relinearization-multilinear-proof"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

# Independent public-Aux arithmetic STARK; never workspace or production acceptance.
[workspace]

[dependencies]
bfv-multilinear-stark = { path = "../../crates/bfv-multilinear-stark" }
bfv-relinearization-circuit = { path = "../../crates/bfv-relinearization-circuit", features = ["plonky3"] }
bounded-postcard = { path = "../../crates/bounded-postcard" }
p3-air = "=0.8.0"
p3-field = "=0.8.0"
p3-lookup = { version = "=0.8.0", default-features = false }
p3-matrix = "=0.8.0"
p3-merkle-tree = "=0.8.0"
p3-multi-stark = { version = "=0.8.0", default-features = false }
p3-sumcheck = { version = "=0.8.0", default-features = false }
p3-whir = { version = "=0.8.0", default-features = false }
postcard = { version = "=1.1.3", default-features = false, features = ["alloc"] }
serde = { version = "=1.0.229", default-features = false, features = ["derive", "alloc"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"

[dev-dependencies]
fhe = { version = "=0.1.1", default-features = false }
fhe-math = { version = "=0.1.1", default-features = false }
fhe-traits = "=0.1.1"
p3-challenger = "=0.8.0"
p3-symmetric = "=0.8.0"
rand = "=0.9.2"

[profile.release]
debug = 0

[profile.test]
opt-level = 3
debug = 0
