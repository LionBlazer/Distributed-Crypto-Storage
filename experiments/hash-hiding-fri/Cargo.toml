[package]
name = "hash-hiding-fri"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[dependencies]
bfv-hiding-stark = { path = "../../crates/bfv-hiding-stark" }
registry200-proof = { path = "../../crates/registry200-proof" }
bounded-postcard = { path = "../../crates/bounded-postcard" }
p3-air = "=0.8.0"
p3-challenger = "=0.8.0"
p3-commit = "=0.8.0"
p3-dft = "=0.8.0"
p3-field = "=0.8.0"
p3-fri = "=0.8.0"
p3-merkle-tree = "=0.8.0"
p3-symmetric = "=0.8.0"
p3-uni-stark = "=0.8.0"
postcard = { version = "=1.1.3", features = ["alloc"] }
rand = { version = "=0.10.3", default-features = false, features = ["std", "std_rng", "sys_rng"] }
sha2 = "=0.10.9"

[dev-dependencies]
compact-store = { path = "../../crates/compact-store" }
zeroize = "=1.9.1"
