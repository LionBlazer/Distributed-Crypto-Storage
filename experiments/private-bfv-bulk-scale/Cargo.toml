[package]
name = "private-bfv-bulk-scale"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace]

[dependencies]
compact-query = { path = "../../crates/compact-query", default-features = false, features = ["bfv-experiment"] }
compact-store = { path = "../../crates/compact-store" }
spiral-owner-state = { path = "../spiral-owner-state" }
spiral-rs = { path = "../../.local/private-access/sdk/lib/spiral-rs", features = ["server"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "=0.10.9"
getrandom = "=0.2.17"
rayon = "1.11"
