[package]
name = "bfv-ntt-batch-proof"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
[workspace]
# This patch is local to the standalone experiment; no production/root patch.
[dependencies]
bfv-multilinear-stark = { path = "../../crates/bfv-multilinear-stark" }
bfv-ntt-circuit = { path = "../../crates/bfv-ntt-circuit", features = ["multistark"] }
bounded-postcard = { path = "../../crates/bounded-postcard" }
p3-air = "=0.8.0"
p3-field = "=0.8.0"
p3-lookup = { version = "=0.8.0", default-features = false }
p3-matrix = "=0.8.0"
p3-merkle-tree = "=0.8.0"
p3-multi-stark = { path = "../../vendor/p3-multi-stark", version = "=0.8.0", default-features = false, features = ["streaming-lookups"] }
p3-sumcheck = { version = "=0.8.0", default-features = false }
p3-whir = { version = "=0.8.0", default-features = false }
postcard = { version = "=1.1.3", default-features = false, features = ["alloc"] }
serde = { version = "=1.0.229", default-features = false, features = ["derive", "alloc"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"
[dev-dependencies]
fhe-math = { version = "=0.1.1", default-features = false }
p3-challenger = "=0.8.0"
[profile.release]
debug = 0
[profile.test]
opt-level = 3
debug = 0
