[package]
name = "bfv-rns-scale-proof"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

# A separate arithmetic research consumer, never a production acceptance path.
[workspace]

[dependencies]
bfv-arithmetic-stark = { path = "../../crates/bfv-arithmetic-stark" }
bfv-scale-circuit = { path = "../../crates/bfv-scale-circuit", features = ["plonky3"] }
bounded-postcard = { path = "../../crates/bounded-postcard" }
p3-air = "=0.8.0"
p3-field = "=0.8.0"
p3-matrix = "=0.8.0"
p3-uni-stark = "=0.8.0"
postcard = { version = "=1.1.3", features = ["alloc"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"

[dev-dependencies]
fhe-math = "=0.1.1"
ndarray = "=0.17.2"
num-bigint = "=0.4.8"

[profile.release]
debug = 0

[profile.test]
opt-level = 3
debug = 0
