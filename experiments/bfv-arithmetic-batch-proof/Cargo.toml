[package]
name = "bfv-arithmetic-batch-proof"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
[workspace]
# Only this standalone experiment uses the reviewed experimental SDK extension.
[patch.crates-io]
p3-multi-stark = { path = "../p3-multi-stark-streaming" }
[dependencies]
bfv-multilinear-stark = { path = "../../crates/bfv-multilinear-stark" }
bfv-scale-circuit = { path = "../../crates/bfv-scale-circuit", features = ["multistark"] }
bfv-tensor-circuit = { path = "../../crates/bfv-tensor-circuit", features = ["multistark"] }
limb-range-air = { path = "../../crates/limb-range-air" }
bounded-postcard = { path = "../../crates/bounded-postcard" }
p3-air = "=0.8.0"
p3-field = "=0.8.0"
p3-lookup = { version = "=0.8.0", default-features = false }
p3-matrix = "=0.8.0"
p3-merkle-tree = "=0.8.0"
p3-multi-stark = { version = "=0.8.0", default-features = false, features = ["streaming-lookups"] }
p3-sumcheck = { version = "=0.8.0", default-features = false }
p3-whir = { version = "=0.8.0", default-features = false }
postcard = { version = "=1.1.3", default-features = false, features = ["alloc"] }
serde = { version = "=1.0.229", default-features = false, features = ["derive", "alloc"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"
[dev-dependencies]
fhe-math = { version = "=0.1.1", default-features = false }
num-bigint = "=0.4.8"
ndarray = "=0.17.2"
[profile.release]
debug = 0
[profile.test]
opt-level = 3
debug = 0
