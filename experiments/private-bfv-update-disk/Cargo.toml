[package]
name = "private-bfv-update-disk"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace]

[dependencies]
sha2 = "=0.10.9"
bincode = "=1.3.3"
spiral-cache-core = { path = "../spiral-cache-core" }
spiral-owner-state = { path = "../spiral-owner-state" }
compact-bfv-byte-limb-core = { package = "compact-bfv-byte-limb-core", path = "../bfv-byte-limb-core" }
compact-store = { path = "../../crates/compact-store" }
spiral-rs = { path = "../../.local/private-access/sdk/lib/spiral-rs", features = ["server"] }
rayon = "1.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.2"
zeroize = "1"
