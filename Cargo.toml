[workspace]
members = [
    "crates/bfv-hiding-stark",
    "crates/bfv-key-transform",
    "crates/relational-types",
    "crates/peer-protocol",
    "crates/compact-store",
    "crates/compact-query",
    "crates/bfv-query-core",
    "crates/bfv-fixed-geometry",
    "crates/bfv-linear-circuit",
    "crates/bfv-product-circuit",
    "crates/bfv-scale-circuit",
    "crates/bfv-ntt-circuit",
    "crates/bfv-tensor-circuit",
    "crates/bfv-relinearization-circuit",
    "crates/bfv-relinearization-key-source",
    "crates/bfv-arithmetic-stark",
    "crates/bfv-multilinear-stark",
    "crates/bfv-query-proof",
    "crates/bounded-postcard",
    "crates/proof-acceleration",
    "crates/version-journal",
    "crates/transaction-state",
    "crates/replica-store",
    "crates/sql-plan",
    "crates/peer-transport",
    "crates/peer-runtime",
    "crates/storage-client",
    "apps/dcs-peer",
    "apps/proof-kernel",
    "tools/launcher",
    "playground",
    "experiments/fhe-prototype",
    "experiments/core-workloads",
]
default-members = [
    "crates/bfv-hiding-stark",
    "crates/bfv-key-transform",
    "crates/relational-types",
    "crates/peer-protocol",
    "crates/compact-store",
    "crates/compact-query",
    "crates/bfv-query-core",
    "crates/bfv-fixed-geometry",
    "crates/bfv-linear-circuit",
    "crates/bfv-product-circuit",
    "crates/bfv-scale-circuit",
    "crates/bfv-ntt-circuit",
    "crates/bfv-tensor-circuit",
    "crates/bfv-relinearization-circuit",
    "crates/bfv-relinearization-key-source",
    "crates/bfv-arithmetic-stark",
    "crates/bfv-multilinear-stark",
    "crates/bfv-query-proof",
    "crates/bounded-postcard",
    "crates/proof-acceleration",
    "crates/version-journal",
    "crates/transaction-state",
    "crates/replica-store",
    "crates/sql-plan",
    "crates/peer-transport",
    "crates/peer-runtime",
    "crates/storage-client",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.91.1"

[workspace.dependencies]
tfhe = { version = "=1.8.1", default-features = false, features = ["integer"] }
rayon = "1.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# FHE operations and the tests exercising them need an optimized build.
[profile.release]
debug = 0

[profile.test]
opt-level = 3
debug = 0
