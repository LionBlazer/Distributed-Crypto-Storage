[workspace]
members = ["crates/fhe-prototype", "crates/fhe-playground", "crates/peer-protocol", "crates/compact-store", "crates/compact-query"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.91.1"

[workspace.dependencies]
tfhe = { version = "=1.8.1", default-features = false, features = ["integer"] }
rayon = "1.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# FHE operations and the tests exercising them need an optimized build.
[profile.release]
debug = 0

[profile.test]
opt-level = 3
debug = 0
