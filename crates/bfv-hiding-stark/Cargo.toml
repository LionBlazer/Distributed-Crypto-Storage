[package]
name = "bfv-hiding-stark"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[features]
transcript-audit = []

[dependencies]
p3-air = "=0.8.0"
p3-challenger = "=0.8.0"
p3-commit = "=0.8.0"
p3-dft = "=0.8.0"
p3-field = "=0.8.0"
p3-fri = "=0.8.0"
p3-goldilocks = "=0.8.0"
p3-matrix = "=0.8.0"
p3-merkle-tree = "=0.8.0"
p3-poseidon2 = "=0.8.0"
p3-security = "=0.8.0"
p3-symmetric = "=0.8.0"
p3-uni-stark = "=0.8.0"
p3-maybe-rayon = { version = "=0.8.0", features = ["parallel"] }
rand = { version = "=0.10.3", default-features = false, features = ["std", "std_rng", "sys_rng"] }
sha2 = "=0.10.9"
bounded-postcard = { path = "../bounded-postcard" }
postcard = { version = "=1.1.3", features = ["alloc"] }
