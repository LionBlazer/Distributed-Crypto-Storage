[package]
name = "bfv-query-proof"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[features]
default = ["runtime-dispatch"]
runtime-dispatch = ["proof-acceleration/loader"]

[dependencies]
bfv-linear-circuit = { path = "../bfv-linear-circuit" }
bfv-product-circuit = { path = "../bfv-product-circuit" }
proof-acceleration = { path = "../proof-acceleration", default-features = false }
p3-air = "=0.8.0"
p3-challenger = "=0.8.0"
p3-commit = "=0.8.0"
p3-dft = "=0.8.0"
p3-field = "=0.8.0"
p3-fri = "=0.8.0"
p3-goldilocks = "=0.8.0"
p3-matrix = "=0.8.0"
p3-maybe-rayon = { version = "=0.8.0", features = ["parallel"] }
p3-merkle-tree = "=0.8.0"
p3-symmetric = "=0.8.0"
p3-uni-stark = "=0.8.0"
postcard = { version = "=1.1.3", features = ["alloc"] }
serde = { version = "=1.0.229", features = ["derive"] }
sha2 = "=0.10.9"

[dev-dependencies]
bfv-query-core = { path = "../bfv-query-core" }
