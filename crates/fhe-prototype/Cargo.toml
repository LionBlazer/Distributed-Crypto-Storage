[package]
name = "fhe-prototype"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
tfhe.workspace = true
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true
getrandom = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_ProcessStatus", "Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
bincode = "1.3"
blake3 = "1.8"

[features]
# Opt-in operation accounting only; this does not generate a query proof.
proof-cost = ["tfhe/pbs-stats"]

[[example]]
name = "proof_cost"
required-features = ["proof-cost"]
