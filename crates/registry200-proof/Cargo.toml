[package]
name = "registry200-proof"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[dependencies]
bfv-ciphertext-formation = { path = "../bfv-ciphertext-formation" }
bfv-unrelinearized-product = { path = "../bfv-unrelinearized-product" }
bfv-key-transform = { path = "../bfv-key-transform" }
bfv-hiding-stark = { path = "../bfv-hiding-stark" }
compact-store = { path = "../compact-store" }
version-journal = { path = "../version-journal" }
p3-air = "=0.8.0"
p3-field = "=0.8.0"
p3-goldilocks = "=0.8.0"
p3-matrix = "=0.8.0"
p3-symmetric = "=0.8.0"
p3-uni-stark = "=0.8.0"
sha2 = "=0.10.9"
zeroize = "=1.9.1"

p3-fri = "=0.8.0"
p3-batch-stark = "=0.8.0"
bounded-postcard = { path = "../bounded-postcard" }
postcard = { version = "=1.1.3", features = ["alloc"] }
p3-lookup = "=0.8.0"
p3-commit = "=0.8.0"
p3-security = "=0.8.0"
p3-dft = "=0.8.0"
rand_public_pp = { package = "rand", version = "=0.10.3", default-features = false, features = ["std_rng"] }

[dev-dependencies]
bfv-query-core = { path = "../bfv-query-core", features = ["gold-owner"] }
fhe-math = { version = "=0.1.1", default-features = false }
fhe = "=0.1.1"
fhe-traits = "=0.1.1"
rand = "=0.9.2"
