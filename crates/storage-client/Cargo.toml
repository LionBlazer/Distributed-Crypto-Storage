[package]
name = "storage-client"
version = "0.1.0"
edition.workspace = true
rust-version = "1.99"
publish = false

[features]
word-query = ["bfv-query-core/gold-owner", "dep:registry200-proof", "registry200-proof/owner-read", "dep:p3-field", "dep:sha2"]
private-input-proofs = [
    "bfv-query-core/formation-proofs",
    "dep:registry200-proof",
    "dep:registry200-journal",
    "dep:registry200-joint",
    "dep:registry200-finality",
    "dep:work-finality",
    "dep:bfv-key-transform",
    "dep:bfv-basis-convolution",
    "dep:bfv-ciphertext-formation",
    "dep:bfv-mul-relin-proof",
    "dep:bfv-product-evidence",
    "dep:p3-field",
    "dep:sha2",
    "dep:chacha20poly1305",
    "dep:protocol-storage",
]

[dependencies]
registry200-proof = { path = "../registry200-proof", optional = true }
registry200-journal = { path = "../registry200-journal", optional = true }
registry200-joint = { path = "../registry200-joint", optional = true }
registry200-finality = { path = "../registry200-finality", optional = true }
work-finality = { path = "../work-finality", optional = true }
bfv-key-transform = { path = "../bfv-key-transform", optional = true }
bfv-basis-convolution = { path = "../bfv-basis-convolution", optional = true }
bfv-ciphertext-formation = { path = "../bfv-ciphertext-formation", optional = true }
bfv-mul-relin-proof = { path = "../bfv-mul-relin-proof", optional = true }
bfv-product-evidence = { path = "../bfv-product-evidence", optional = true }
p3-field = { version = "=0.8.0", optional = true }
sha2 = { version = "=0.10.9", optional = true }
chacha20poly1305 = { version = "=0.10.1", optional = true }
protocol-storage = { path = "../protocol-storage", optional = true }
peer-runtime = { path = "../peer-runtime" }
compact-query = { path = "../compact-query", default-features = false, features = ["bfv-experiment"] }
compact-store = { path = "../compact-store" }
proof-acceleration = { path = "../proof-acceleration", default-features = false }
sql-plan = { path = "../sql-plan" }
bfv-query-core = { path = "../bfv-query-core" }
bfv-query-proof = { path = "../bfv-query-proof" }
version-journal = { path = "../version-journal" }
ed25519-dalek = "=2.2.0"
getrandom = "0.2"
relational-types = { path = "../relational-types" }
serde.workspace = true
serde_json.workspace = true
zeroize = "1"

[dev-dependencies]
bfv-hiding-stark = { path = "../bfv-hiding-stark" }
bfv-ciphertext-formation = { path = "../bfv-ciphertext-formation" }
fhe-math = { version = "=0.1.1", default-features = false }
bfv-product-evidence = { path = "../bfv-product-evidence" }
peer-transport = { path = "../peer-transport" }
rcgen = "=0.14.8"
protocol-storage = { path = "../protocol-storage" }
work-finality = { path = "../work-finality" }
