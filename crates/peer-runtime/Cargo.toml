[package]
name = "peer-runtime"
version = "0.1.0"
edition.workspace = true
rust-version = "1.99"
publish = false

[dependencies]
bfv-product-evidence = { path = "../bfv-product-evidence" }
protocol-storage = { path = "../protocol-storage" }
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["std", "fast", "zeroize"] }
zeroize = "=1.9.1"
serde_json.workspace = true
registry200-journal = { path = "../registry200-journal" }
registry200-finality = { path = "../registry200-finality" }
work-finality = { path = "../work-finality" }
peer-transport = { path = "../peer-transport" }
bfv-query-core = { path = "../bfv-query-core" }
bfv-query-proof = { path = "../bfv-query-proof" }
bfv-mul-relin-proof = { path = "../bfv-mul-relin-proof" }
bfv-relinearization-key-source = { path = "../bfv-relinearization-key-source" }
version-journal = { path = "../version-journal" }
compact-store = { path = "../compact-store" }
proof-acceleration = { path = "../proof-acceleration", default-features = false }
serde.workspace = true
bincode = "1.3"
sha2 = "=0.10.9"
mio = { version = "=1.2.4", default-features = false, features = ["net", "os-poll"] }
getrandom = "=0.2.17"

[dev-dependencies]
registry200-proof = { path = "../registry200-proof" }
rcgen = "=0.14.8"
