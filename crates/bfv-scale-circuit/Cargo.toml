[package]
name = "bfv-scale-circuit"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[features]
default = []
plonky3 = ["dep:p3-air", "dep:p3-field", "dep:p3-matrix", "dep:p3-goldilocks"]
multistark = ["dep:p3-air", "dep:p3-field", "dep:p3-matrix", "dep:p3-goldilocks", "dep:p3-lookup", "dep:limb-range-air"]

[dependencies]
bfv-fixed-geometry = { path = "../bfv-fixed-geometry" }
ethnum = "=1.5.3"
num-bigint = "=0.4.8"
num-traits = "=0.2.19"
sha2 = "=0.10.9"
p3-air = { version = "=0.8.0", optional = true }
p3-field = { version = "=0.8.0", optional = true }
p3-matrix = { version = "=0.8.0", optional = true }
p3-goldilocks = { version = "=0.8.0", optional = true }
p3-lookup = { version = "=0.8.0", optional = true }
limb-range-air = { path = "../limb-range-air", optional = true }
