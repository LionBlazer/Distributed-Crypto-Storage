[package]
name = "work-finality"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
sha2 = "=0.10.9"
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["std", "fast", "zeroize"] }

[dev-dependencies]
# Actual alternative valid signatures by a non-secret test key holder only.
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["std", "fast", "zeroize", "hazmat"] }
