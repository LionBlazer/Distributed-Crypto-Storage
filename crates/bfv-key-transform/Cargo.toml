[package]
name = "bfv-key-transform"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[dependencies]
bfv-hiding-stark = { path = "../bfv-hiding-stark" }
p3-air = "=0.8.0"
p3-dft = "=0.8.0"
p3-field = "=0.8.0"
p3-goldilocks = "=0.8.0"
p3-matrix = "=0.8.0"
p3-symmetric = "=0.8.0"
p3-uni-stark = "=0.8.0"
rand = { version = "=0.10.3", default-features = false, features = ["std", "std_rng", "sys_rng"] }
sha2 = "=0.10.9"
zeroize = "=1.9.1"
