[package]
name = "bfv-ciphertext-formation"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[dependencies]
bfv-basis-convolution = { path = "../bfv-basis-convolution" }
bfv-key-transform = { path = "../bfv-key-transform" }
bfv-hiding-stark = { path = "../bfv-hiding-stark" }
p3-air = "=0.8.0"
p3-field = "=0.8.0"
p3-matrix = "=0.8.0"
p3-uni-stark = "=0.8.0"
sha2 = "=0.10.9"
zeroize = "=1.9.1"
bounded-postcard = { path = "../bounded-postcard" }
p3-batch-stark = "=0.8.0"
p3-commit = "=0.8.0"
p3-dft = "=0.8.0"
p3-fri = "=0.8.0"
p3-goldilocks = "=0.8.0"
p3-lookup = "=0.8.0"
p3-security = "=0.8.0"
postcard = { version = "=1.1.3", features = ["alloc"] }
rand-public-pp = { package = "rand", version = "=0.10.3", default-features = false, features = ["std", "std_rng", "sys_rng"] }

[dev-dependencies]
fhe = "=0.1.1"
fhe-math = "=0.1.1"
fhe-traits = "=0.1.1"
rand = "=0.9.2"

# Test-only independent native Poseidon permutation oracle; already locked.
p3-symmetric = "=0.8.0"
