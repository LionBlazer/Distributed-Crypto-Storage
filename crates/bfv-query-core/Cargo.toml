[package]
name = "bfv-query-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false


[features]
basis-proofs = ["key-proofs", "dep:bfv-basis-convolution"]
key-proofs = ["dep:bfv-key-transform", "dep:bfv-hiding-stark", "dep:p3-field"]

[dependencies]
bfv-basis-convolution = { path = "../bfv-basis-convolution", optional = true }
bfv-key-transform = { path = "../bfv-key-transform", optional = true }
bfv-hiding-stark = { path = "../bfv-hiding-stark", optional = true }
p3-field = { version = "=0.8.0", optional = true }
bfv-fixed-geometry = { path = "../bfv-fixed-geometry" }
bfv-linear-circuit = { path = "../bfv-linear-circuit" }
bfv-product-circuit = { path = "../bfv-product-circuit" }
fhe = "=0.1.1"
fhe-math = "=0.1.1"
fhe-traits = "=0.1.1"
rand = "=0.9.2"
serde = { version = "1", features = ["derive"] }
bincode = "=1.3.3"
sha2 = "=0.10.9"
zeroize = "1"

[dev-dependencies]
p3-dft = "=0.8.0"
p3-goldilocks = "=0.8.0"
p3-symmetric = "=0.8.0"
postcard = { version = "=1.1.3", features = ["alloc"] }
serde_json = '=1.0.154'
